name: Collect

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mpns:
        description: "Comma-separated MPNs to refresh (optional - blank means every enabled source)"
        required: false

# Includes the post-collection heal step, so a second manual Heal workflow cannot collide
# with a one-click refresh while Bright Data is refactoring the collector.
concurrency:
  group: vantagezero-brightdata-heal
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run every enabled collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          # Incidents and critical buildability alerts only - SLACK_ACTIVITY_FEED is
          # deliberately left unset here so a full --all cycle doesn't burst one success
          # line per source target into the channel and rate-limit the alerts that matter.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${{ github.event.inputs.mpns }}" ]; then
            npx tsx scripts/ingest.ts --mpns "${{ github.event.inputs.mpns }}"
          else
            npx tsx scripts/ingest.ts --all
          fi
      - name: Heal incidents from this collection
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${{ github.event.inputs.mpns }}" ]; then
            npx tsx scripts/heal-loop.ts --force --max-incidents 1 --mpns "${{ github.event.inputs.mpns }}"
          else
            npx tsx scripts/heal-loop.ts --max-incidents 1
          fi
