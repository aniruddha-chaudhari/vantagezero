name: Heal

on:
  workflow_run:
    workflows: ["Collect"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass rate discipline (manual/demo run)"
        type: boolean
        default: false
      sourceTargetId:
        description: "Only heal this source target ID (optional)"
        required: false

jobs:
  heal:
    # Only run after a successful Collect cycle, or on a manual dispatch - no point trying
    # to heal anything if the trigger itself couldn't even reach the app.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run the heal loop
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ github.event.inputs.sourceTargetId }}" ]; then ARGS="$ARGS --source-target-id ${{ github.event.inputs.sourceTargetId }}"; fi
          npx tsx scripts/heal-loop.ts $ARGS
